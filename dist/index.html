  <!-- ── ERROR CAPTURE (temp debug) ── -->
  <script>
    window.__nexoErrors = [];
    var _origCE = console.error;
    console.error = function() {
      var msg = Array.from(arguments).map(function(a){ return a instanceof Error ? a.stack : String(a); }).join(' ');
      window.__nexoErrors.push(msg);
      _origCE.apply(console, arguments);
    };
    window.onerror = function(msg,src,line,col,err) {
      window.__nexoErrors.push('onerror: ' + msg + ' @ ' + src + ':' + line);
    };
    window.onunhandledrejection = function(e) {
      window.__nexoErrors.push('unhandled: ' + String(e.reason));
    };
  </script>
  <script>
