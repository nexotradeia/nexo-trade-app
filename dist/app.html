    /* Loader inicial mientras carga React — skeleton con logo animado */
    #nexo-loader {
      position: fixed; inset: 0;
      background: radial-gradient(120% 120% at 50% 0%, #11294a 0%, #0b1426 55%, #080f1c 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      z-index: 9999; transition: opacity 0.45s ease;
    }
    #nexo-loader.hide { opacity: 0; pointer-events: none; }
    #nexo-loader .nl-logo { animation: nlFloat 2.6s ease-in-out infinite; filter: drop-shadow(0 8px 28px rgba(15,94,104,0.45)); }
    @keyframes nlFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
    #nexo-loader .nl-line { stroke-dasharray: 60; stroke-dashoffset: 60; animation: nlDraw 1.8s ease-in-out infinite; }
    @keyframes nlDraw { 0%{stroke-dashoffset:60} 55%{stroke-dashoffset:0} 100%{stroke-dashoffset:0} }
    #nexo-loader .nl-word {
      font-family:'Syne','Inter',sans-serif; font-weight:800; font-size:25px; letter-spacing:-0.5px;
      background:linear-gradient(90deg,#4f9fd4,#19b3a6); -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    #nexo-loader .nl-bar { width:170px; height:5px; border-radius:99px; background:rgba(255,255,255,0.08); overflow:hidden; position:relative; }
    #nexo-loader .nl-bar::after { content:""; position:absolute; inset:0; width:42%; border-radius:99px;
      background:linear-gradient(90deg,#0F4C81,#19b3a6); animation: nlBar 1.25s ease-in-out infinite; }
    @keyframes nlBar { 0%{transform:translateX(-110%)} 100%{transform:translateX(280%)} }
    #nexo-loader .nl-sub { color:#5b7290; font-size:11.5px; font-weight:600; letter-spacing:0.5px; margin:0; }
