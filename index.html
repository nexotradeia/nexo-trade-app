<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── PRIMARY META ──────────────────────────────────────── -->

  <!-- ── OPEN GRAPH (Facebook, WhatsApp, LinkedIn) ─────────── -->

  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale"      content="es_ES" />
  <meta property="og:site_name"   content="NexoTrade" />

  <!-- ── TWITTER / X CARD ──────────────────────────────────── -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:site"        content="@NexoTradeIA" />
  <meta name="twitter:creator"     content="@NexoTradeIA" />
  <meta name="twitter:title"       content="NexoTrade — La comunidad inversora en español" />
  <meta name="twitter:description" content="Red social de trading en español. Picks VIP, webinars en vivo, análisis técnico y más. Únete gratis." />
  <meta name="twitter:image"       content="https://nexotradeia.com/og-image.png" />

  <!-- ── PWA / MOBILE ──────────────────────────────────────── -->
  <link rel="manifest"      href="/manifest.json" />
  <meta name="theme-color"  content="#00A8FF" />
  <meta name="mobile-web-app-capable"        content="yes" />
  <meta name="apple-mobile-web-app-capable"  content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title"    content="NexoTrade" />

  <!-- ── ICONS ─────────────────────────────────────────────── -->
  <link rel="icon"             type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon"             type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />

  <!-- ── FONTS (sistema — sin petición externa) ────────────── -->
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F0F4F8; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    #root { min-height: 100vh; }

    /* Loader inicial mientras carga React */
    #nexo-loader {
      position: fixed; inset: 0; background: #F0F4F8;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      z-index: 9999; transition: opacity 0.4s;
    }
    #nexo-loader.hide { opacity: 0; pointer-events: none; }
    #nexo-loader svg { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.7;transform:scale(0.97)} }
    #nexo-loader p { color: #64748B; font-size: 14px; font-weight: 500; margin: 0; }
  </style>

  <!-- ── STRUCTURED DATA (Google Rich Results) ─────────────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "NexoTrade",
    "url": "https://nexotradeia.com",
    "description": "La comunidad inversora en español. Trading, análisis técnico, crypto, acciones y webinars en vivo.",
    "inLanguage": "es",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://nexotradeia.com/?ticker={search_term_string}",
      "query-input": "required name=search_term_string"
    },
    "sameAs": [
      "https://twitter.com/NexoTradeIA"
    ]
  }
  </script>
</head>
<body>
  <!-- Loader inicial -->
  <div id="nexo-loader">
    <svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="56" height="56" rx="14" fill="#00A8FF"/>
      <path d="M14 38L22 26L30 32L38 18" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="42" cy="18" r="3" fill="#00E58F"/>
    </svg>
    <p>Cargando NexoTrade...</p>
  </div>

  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
  <script>
    // Ocultar loader cuando React monta
    window.__nexoLoaderHide = function() {
      var l = document.getElementById('nexo-loader');
      if (l) { l.classList.add('hide'); setTimeout(function(){ l.remove(); }, 500); }
    };
  </script>
</body>
</html>
