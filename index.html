    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html {
        height: -webkit-fill-available; /* iOS Safari fullscreen fix */
      }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0B1020;
        color: #F0F4FF;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%; /* evita zoom automático en iOS */
        overscroll-behavior: none;      /* evita el "bounce" en móvil */
        min-height: 100vh;
        min-height: -webkit-fill-available;
        padding-top: env(safe-area-inset-top);       /* notch iPhone */
        padding-bottom: env(safe-area-inset-bottom); /* home bar iPhone */
      }
      #root {
        min-height: 100vh;
        min-height: -webkit-fill-available;
      }
      /* Ocultar scrollbar en móvil para look nativo */
      @media (max-width: 767px) {
        ::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #0B1020; }
      ::-webkit-scrollbar-thumb { background: #1E2D45; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #00D26A44; }
      * { transition: color 0.15s, background 0.15s, border-color 0.15s, box-shadow 0.15s; }
      /* Splash screen mientras carga (PWA) */
      #root:empty::before {
        content: '';
        display: block;
        width: 100vw;
        height: 100vh;
        background: #0B1020 url('/logo2.png') center / 180px no-repeat;
      }
    </style>
  </head>
