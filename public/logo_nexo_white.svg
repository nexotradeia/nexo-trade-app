<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320">
  <defs>
    <linearGradient id="nexoGradW" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="55%" stop-color="#2f8fd6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="orbitW1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="orbitW2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <!-- ORBITAL RINGS -->
  <ellipse cx="210" cy="118" rx="78" ry="28"
    fill="none" stroke="url(#orbitW1)" stroke-width="2" opacity="0.95"
    transform="rotate(35,210,118)"/>
  <ellipse cx="210" cy="118" rx="78" ry="28"
    fill="none" stroke="url(#orbitW2)" stroke-width="2" opacity="0.95"
    transform="rotate(-35,210,118)"/>
  <ellipse cx="210" cy="118" rx="78" ry="22"
    fill="none" stroke="#0891b2" stroke-width="1.6" opacity="0.7"/>

  <!-- CENTER ICON: N with slash -->
  <g>
    <line x1="196" y1="104" x2="224" y2="132" stroke="#0891b2" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="196" cy="104" r="3.6" fill="#06b6d4"/>
    <circle cx="224" cy="132" r="3.6" fill="#1565C0"/>
    <circle cx="222" cy="105" r="2.6" fill="#1565C0"/>
    <circle cx="197" cy="131" r="2.6" fill="#06b6d4"/>
  </g>

  <!-- ORBITAL DOTS -->
  <circle cx="284" cy="108" r="5" fill="#06b6d4" opacity="0.95"/>
  <circle cx="136" cy="128" r="5" fill="#0891b2" opacity="0.95"/>
  <circle cx="248" cy="145" r="4" fill="#7c3aed" opacity="0.95"/>
  <circle cx="214" cy="58"  r="5" fill="#1565C0" opacity="0.95"/>
  <circle cx="207" cy="178" r="4" fill="#a855f7" opacity="0.9"/>
  <circle cx="170" cy="100" r="4" fill="#06b6d4" opacity="0.8"/>
  <circle cx="252" cy="136" r="3.5" fill="#1565C0" opacity="0.8"/>

  <!-- NEXO text -->
  <text x="210" y="232"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="72" font-weight="900"
    text-anchor="middle"
    fill="url(#nexoGradW)"
    letter-spacing="6">NEXO</text>

  <!-- separator line -->
  <line x1="100" y1="242" x2="320" y2="242" stroke="#1565C0" stroke-width="1.2" opacity="0.5"/>

  <!-- TRADE text -->
  <text x="210" y="284"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="56" font-weight="900"
    text-anchor="middle"
    fill="#0a1628"
    letter-spacing="10">TRADE</text>

  <!-- Tagline -->
  <text x="210" y="308"
    font-family="'Arial', sans-serif"
    font-size="11" font-weight="500"
    text-anchor="middle"
    fill="#64748B"
    letter-spacing="3.5">AI POWERED TRADING COMMUNITY</text>
</svg>
